services:
  # Backend: FastAPI в Docker-контейнері
  - type: web
    name: api-body-faker-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # URL фронтенда для CORS. Render за замовчуванням видає домен
      # https://<service-name>.onrender.com, тому адреса передбачувана.
      # Якщо після першого деплою Render присвоїть інший домен (напр. через
      # зайняте ім'я) — онови це значення в дашборді Render вручну.
      - key: CORS_ORIGINS
        value: https://api-body-faker-frontend.onrender.com

  # Frontend: статичний білд Vite/React
  - type: web
    name: api-body-faker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api-body-faker-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
